services:
  fuzzball-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fuzzball-api:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: [CMD, /nodejs/bin/node, src/healthcheck.js]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
